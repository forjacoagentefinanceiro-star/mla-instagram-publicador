name: Publicar Instagram

on:
  schedule:
    # a cada 15 min (minutos 7, 22, 37, 52, fora do pico do GitHub) das 10h às 20h59 (Brasília = UTC-3); fora disso não roda, para caber no limite grátis do GitHub
    - cron: "7,22,37,52 13-23 * * *"
  push:
    branches: [main]
    paths: ["agenda.json"]
  workflow_dispatch:
    inputs:
      teste_hospedagem:
        description: "Só testar o envio de arquivo para o site de hospedagem (não publica)"
        type: boolean
        default: false
      dry_run:
        description: "Só mostrar o que seria publicado (não publica)"
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo
      PYTHONUTF8: "1"
      INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
      INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      META_API_VERSION: ${{ secrets.META_API_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testar hospedagem
        if: ${{ inputs.teste_hospedagem }}
        run: python scripts/teste_hospedagem.py

      - name: Mostrar o que venceu (dry-run)
        if: ${{ inputs.dry_run }}
        run: python scripts/agenda.py --dry-run

      - name: Publicar o que venceu
        if: ${{ !inputs.teste_hospedagem && !inputs.dry_run }}
        run: python scripts/agenda.py

      - name: Salvar status na agenda
        if: ${{ !inputs.teste_hospedagem && !inputs.dry_run }}
        run: |
          git config user.name "publicador-mla"
          git config user.email "publicador-mla@users.noreply.github.com"
          git add agenda.json
          if ! git diff --cached --quiet; then
            git commit -m "agenda: status atualizado pelo publicador"
            git pull --rebase
            git push
          fi
